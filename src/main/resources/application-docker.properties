# "docker" profile: containerized app with PostgreSQL from docker compose.
# Enabled via SPRING_PROFILES_ACTIVE=docker in compose.yml.

spring.datasource.url=jdbc:postgresql://postgres:5432/agentindex
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=agentindex
spring.datasource.password=agentindex

# No migrations yet: Hibernate creates/updates the schema at startup.
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
