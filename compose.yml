services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        # Wait until the DB is ready to accept connections, not just started
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      # Published for local inspection only (IDE, psql); containers use the internal network
      - "5432:5432"
    environment:
      # These must match application-docker.properties
      POSTGRES_DB: agentindex
      POSTGRES_USER: agentindex
      POSTGRES_PASSWORD: agentindex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentindex -d agentindex"]
      interval: 2s
      timeout: 3s
      retries: 15
